<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Kẹo Chip Chip - Tiện Ích Bán Hàng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fdf8f4; }
        .candy-gradient { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-gray-800 min-h-screen pb-20">

    <!-- Header -->
    <header class="candy-gradient text-white shadow-lg sticky top-0 z-30 px-4 py-3.5">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <span class="text-3xl">🍬</span>
                <div>
                    <h1 class="text-lg font-bold leading-tight">ChipChip Order Manager</h1>
                    <p class="text-xs text-pink-100">Sổ tay tính tổng & đơn hàng cho Vợ</p>
                </div>
            </div>
            <button onclick="exportZaloSummary()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1 transition">
                <span>📋</span> Chép Zalo
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">

        <!-- Thẻ Tổng Kết Nhanh (Real-time Totals) -->
        <div class="grid grid-cols-3 gap-2.5">
            <div class="glass-card p-3 rounded-2xl shadow-sm border border-pink-100 text-center">
                <span class="text-xs text-gray-500 font-medium">Tổng Khối Lượng</span>
                <div class="text-xl font-bold text-pink-600 mt-0.5" id="totalKgDisplay">0.0 kg</div>
                <div class="text-[11px] text-gray-400 font-semibold" id="totalLangDisplay">(0 lạng)</div>
            </div>
            <div class="glass-card p-3 rounded-2xl shadow-sm border border-purple-100 text-center">
                <span class="text-xs text-gray-500 font-medium">Tổng Tiền Dự Kiến</span>
                <div class="text-xl font-bold text-purple-600 mt-0.5" id="totalMoneyDisplay">0 đ</div>
                <div class="text-[11px] text-gray-400 font-semibold" id="totalOrdersDisplay">0 đơn</div>
            </div>
            <div class="glass-card p-3 rounded-2xl shadow-sm border border-emerald-100 text-center">
                <span class="text-xs text-gray-500 font-medium">Đã Thu Tiền</span>
                <div class="text-xl font-bold text-emerald-600 mt-0.5" id="paidMoneyDisplay">0 đ</div>
                <div class="text-[11px] text-amber-500 font-semibold" id="debtDisplay">Nợ: 0 đ</div>
            </div>
        </div>

        <!-- Form Thêm Đơn Hàng Mới -->
        <div class="glass-card rounded-2xl p-4 shadow-sm border border-pink-100">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1.5">
                    <span>➕</span> Thêm Đơn Hàng Mới
                </h2>
                <div class="flex items-center gap-1 text-xs text-gray-500">
                    <span>Đơn giá/lạng:</span>
                    <input type="number" id="unitPriceInput" value="15000" onchange="updateAllTotals()" class="w-20 px-2 py-0.5 rounded border border-gray-300 text-right font-bold text-pink-600 focus:outline-none focus:border-pink-500">
                    <span>đ</span>
                </div>
            </div>

            <form id="orderForm" onsubmit="addOrder(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tên khách hàng / Ghi chú</label>
                    <input type="text" id="custName" placeholder="Ví dụ: Cô Thanh, Mụ Hoa Gạo, Chị Khánh..." required
                        class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 bg-white">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Số Lượng (Lạng):</label>
                    <!-- Phím bấm số lượng nhanh 1 chạm cho điện thoại -->
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        <button type="button" onclick="selectQuickQty(2)" class="qty-pill px-3 py-1 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">2 lạng</button>
                        <button type="button" onclick="selectQuickQty(3)" class="qty-pill px-3 py-1 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">3 lạng</button>
                        <button type="button" onclick="selectQuickQty(4)" class="qty-pill px-3 py-1 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">4 lạng</button>
                        <button type="button" onclick="selectQuickQty(5)" class="qty-pill px-3 py-1 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">5 lạng (0.5kg)</button>
                        <button type="button" onclick="selectQuickQty(10)" class="qty-pill px-3 py-1 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">10 lạng (1kg)</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" step="0.5" min="0.5" id="custQty" placeholder="Nhập số lạng (hoặc bấm nút trên)" required
                            class="flex-1 px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 bg-white">
                        <select id="custFlavor" class="px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none bg-white text-gray-700">
                            <option value="Thập cẩm">Mix thập cẩm</option>
                            <option value="Dâu tây">Vị Dâu tây</option>
                            <option value="Xoài nhiệt đới">Vị Xoài</option>
                            <option value="Nho đen">Vị Nho</option>
                            <option value="Đào tiên">Vị Đào</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-600 cursor-pointer">
                        <input type="checkbox" id="custPaid" class="rounded text-pink-500 focus:ring-pink-400 w-4 h-4">
                        <span>Đã thanh toán tiền</span>
                    </label>
                    <button type="submit" class="candy-gradient hover:opacity-95 text-white font-bold px-5 py-2 rounded-xl text-sm shadow-md transition transform active:scale-95">
                        ➕ Lưu Đơn Hàng
                    </button>
                </div>
            </form>
        </div>

        <!-- Danh Sách Đơn Hàng -->
        <div class="space-y-2">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Danh Sách Chi Tiết Các Đơn</h3>
                <div class="flex items-center gap-2">
                    <button onclick="clearAllOrders()" class="text-xs text-red-500 hover:text-red-700 font-medium">
                        Xóa tất cả
                    </button>
                </div>
            </div>

            <div id="ordersList" class="space-y-2">
                <!-- Danh sách đơn sẽ được render ở đây -->
            </div>
        </div>

    </main>

    <script>
        // Khởi tạo danh sách mẫu thực tế theo danh sách tính của anh Trường
        const defaultSampleOrders = [
            { id: 1, name: "Cô Thanh", qty: 4, flavor: "Thập cẩm", paid: true, time: "Hôm nay" },
            { id: 2, name: "Cô Nhàn", qty: 2, flavor: "Dâu tây", paid: true, time: "Hôm nay" },
            { id: 3, name: "Vợ anh", qty: 3, flavor: "Thập cẩm", paid: false, time: "Hôm nay" },
            { id: 4, name: "Họ Xuân", qty: 2, flavor: "Xoài", paid: true, time: "Hôm nay" },
            { id: 5, name: "Cô Khánh", qty: 2, flavor: "Nho đen", paid: true, time: "Hôm nay" },
            { id: 6, name: "Cô Tràng", qty: 2, flavor: "Thập cẩm", paid: false, time: "Hôm nay" },
            { id: 7, name: "Cô Vân", qty: 2, flavor: "Đào", paid: true, time: "Hôm nay" },
            { id: 8, name: "Hoài Thương", qty: 3, flavor: "Thập cẩm", paid: true, time: "Hôm nay" },
            { id: 9, name: "Cô Trà My", qty: 4, flavor: "Thập cẩm", paid: false, time: "Hôm nay" },
            { id: 10, name: "Chị Khánh", qty: 5, flavor: "Thập cẩm", paid: true, time: "Hôm nay" },
            { id: 11, name: "Chị Bê", qty: 6, flavor: "Dâu tây", paid: false, time: "Hôm nay" },
            { id: 12, name: "Mụ Hoa Gạo", qty: 3, flavor: "Thập cẩm", paid: true, time: "Hôm nay" },
            { id: 13, name: "Anh Đức", qty: 3, flavor: "Thập cẩm", paid: true, time: "Hôm nay" }
        ];

        let orders = JSON.parse(localStorage.getItem("chipchip_orders"));
        if (!orders || orders.length === 0) {
            orders = defaultSampleOrders;
            localStorage.setItem("chipchip_orders", JSON.stringify(orders));
        }

        function saveOrders() {
            localStorage.setItem("chipchip_orders", JSON.stringify(orders));
            renderOrders();
        }

        function selectQuickQty(num) {
            document.getElementById("custQty").value = num;
        }

        function addOrder(e) {
            e.preventDefault();
            const name = document.getElementById("custName").value.trim();
            const qty = parseFloat(document.getElementById("custQty").value);
            const flavor = document.getElementById("custFlavor").value;
            const paid = document.getElementById("custPaid").checked;

            if (!name || isNaN(qty) || qty <= 0) return;

            const newOrder = {
                id: Date.now(),
                name: name,
                qty: qty,
                flavor: flavor,
                paid: paid,
                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
            };

            orders.unshift(newOrder);
            saveOrders();

            // Reset form
            document.getElementById("custName").value = "";
            document.getElementById("custQty").value = "";
            document.getElementById("custPaid").checked = false;
            document.getElementById("custName").focus();
        }

        function togglePaid(id) {
            const ord = orders.find(o => o.id === id);
            if (ord) {
                ord.paid = !ord.paid;
                saveOrders();
            }
        }

        function deleteOrder(id) {
            if (confirm("Xóa đơn hàng này?")) {
                orders = orders.filter(o => o.id !== id);
                saveOrders();
            }
        }

        function clearAllOrders() {
            if (confirm("Anh có chắc muốn xóa sạch toàn bộ danh sách đơn hàng không?")) {
                orders = [];
                saveOrders();
            }
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + " đ";
        }

        function updateAllTotals() {
            const unitPrice = parseFloat(document.getElementById("unitPriceInput").value) || 0;
            
            // Tính toán số học chính xác 100% bằng phép cộng lũy kế
            let totalLang = 0;
            let totalMoney = 0;
            let paidMoney = 0;

            for (const o of orders) {
                totalLang += o.qty;
                const m = o.qty * unitPrice;
                totalMoney += m;
                if (o.paid) paidMoney += m;
            }

            const totalKg = (totalLang / 10).toFixed(1);
            const debt = totalMoney - paidMoney;

            document.getElementById("totalKgDisplay").innerText = totalKg + " kg";
            document.getElementById("totalLangDisplay").innerText = "(" + totalLang + " lạng)";
            document.getElementById("totalMoneyDisplay").innerText = formatMoney(totalMoney);
            document.getElementById("totalOrdersDisplay").innerText = orders.length + " đơn";
            document.getElementById("paidMoneyDisplay").innerText = formatMoney(paidMoney);
            document.getElementById("debtDisplay").innerText = "Chưa thu: " + formatMoney(debt);
        }

        function renderOrders() {
            const listEl = document.getElementById("ordersList");
            const unitPrice = parseFloat(document.getElementById("unitPriceInput").value) || 0;

            if (orders.length === 0) {
                listEl.innerHTML = `
                    <div class="glass-card p-8 rounded-2xl text-center text-gray-400">
                        <span class="text-3xl block mb-2">📦</span>
                        Chưa có đơn hàng nào. Hãy thêm đơn đầu tiên ở trên nhé!
                    </div>
                `;
                updateAllTotals();
                return;
            }

            listEl.innerHTML = orders.map((o, idx) => {
                const itemTotal = o.qty * unitPrice;
                const kgVal = (o.qty / 10).toFixed(1);
                return `
                    <div class="glass-card p-3 rounded-2xl shadow-sm border border-pink-50 flex items-center justify-between transition hover:shadow-md">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center text-xs font-bold">
                                ${idx + 1}
                            </span>
                            <div>
                                <div class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                                    <span>${o.name}</span>
                                    <span class="text-[11px] font-normal px-1.5 py-0.2 rounded bg-gray-100 text-gray-500">${o.flavor}</span>
                                </div>
                                <div class="text-xs text-gray-500 font-semibold mt-0.5">
                                    <span class="text-pink-600 font-bold">${o.qty} lạng</span> (${kgVal} kg) · ${formatMoney(itemTotal)}
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button onclick="togglePaid(${o.id})" class="px-2.5 py-1 rounded-full text-xs font-bold transition ${
                                o.paid 
                                ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' 
                                : 'bg-amber-100 text-amber-700 hover:bg-amber-200'
                            }">
                                ${o.paid ? '✓ Đã trả' : 'Chưa trả'}
                            </button>
                            <button onclick="deleteOrder(${o.id})" class="text-gray-300 hover:text-red-500 p-1 text-sm transition" title="Xóa">
                                ✕
                            </button>
                        </div>
                    </div>
                `;
            }).join("");

            updateAllTotals();
        }

        function exportZaloSummary() {
            const unitPrice = parseFloat(document.getElementById("unitPriceInput").value) || 0;
            let totalLang = 0;
            let text = "🍬 TỔNG KẾT ĐƠN HÀNG KẸO CHIP CHIP\n";
            text += "=============================\n";

            orders.forEach((o, i) => {
                totalLang += o.qty;
                const kg = (o.qty / 10).toFixed(1);
                const status = o.paid ? "[Đã trả]" : "[Chưa trả]";
                text += `${i + 1}. ${o.name}: ${o.qty} lạng (${kg}kg) - ${o.flavor} ${status}\n`;
            });

            const totalKg = (totalLang / 10).toFixed(1);
            const totalMoney = totalLang * unitPrice;
            text += "=============================\n";
            text += `👉 TỔNG CỘNG: ${totalLang} lạng (= ${totalKg} kg)\n`;
            text += `💰 TỔNG TIỀN: ${new Intl.NumberFormat('vi-VN').format(totalMoney)} đ\n`;

            navigator.clipboard.writeText(text).then(() => {
                alert("Đã sao chép tổng kết đơn hàng vào Clipboard! Vợ anh có thể dán (Paste) ngay vào Zalo hoặc tin nhắn.");
            }).catch(() => {
                alert("Sao chép thất bại, trình duyệt chưa cấp quyền.");
            });
        }

        // Khởi tạo giao diện
        renderOrders();
    </script>
</body>
</html>
