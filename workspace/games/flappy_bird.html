<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Flappy KINI - Neon Cyberpunk Edition</title>
<style>
body { margin: 0; background: #08090e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; overflow: hidden; }
canvas { background: #0c0e17; border: 2px solid #00f2fe; border-radius: 8px; box-shadow: 0 0 25px rgba(0, 242, 254, 0.3); }
#ui { margin-top: 12px; font-size: 14px; color: #94a3b8; }
</style>
</head>
<body>
<canvas id="game" width="400" height="500"></canvas>
<div id="ui">Nhấn Space hoặc Click chuột để nhảy • Sáng tạo bởi KINI AI</div>
<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let bird = { x: 50, y: 250, vy: 0, gravity: 0.32, jump: -6.2, r: 14 };
let pipes = [];
let score = 0;
let frames = 0;
let over = false;
function reset() { bird.y = 250; bird.vy = 0; pipes = []; score = 0; over = false; }
window.addEventListener('keydown', e => { if (e.code === 'Space') { if(over) reset(); else bird.vy = bird.jump; } });
cvs.addEventListener('mousedown', () => { if(over) reset(); else bird.vy = bird.jump; });
function loop() {
    frames++;
    if (!over) {
        bird.vy += bird.gravity;
        bird.y += bird.vy;
        if (bird.y + bird.r > cvs.height || bird.y - bird.r < 0) over = true;
        if (frames % 85 === 0) {
            let gap = 125;
            let topH = Math.floor(Math.random() * (cvs.height - gap - 100)) + 50;
            pipes.push({ x: cvs.width, top: topH, bottom: topH + gap });
        }
        for (let i = 0; i < pipes.length; i++) {
            let p = pipes[i];
            p.x -= 2.6;
            if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 44) {
                if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) over = true;
            }
            if (p.x + 44 < bird.x && !p.passed) { score++; p.passed = true; }
        }
        pipes = pipes.filter(p => p.x > -50);
    }
    ctx.fillStyle = '#0c0e17'; ctx.fillRect(0, 0, cvs.width, cvs.height);
    for (let p of pipes) {
        ctx.fillStyle = '#9d4edd'; ctx.fillRect(p.x, 0, 44, p.top);
        ctx.fillRect(p.x, p.bottom, 44, cvs.height - p.bottom);
        ctx.strokeStyle = '#c77dff'; ctx.strokeRect(p.x, 0, 44, p.top);
        ctx.strokeRect(p.x, p.bottom, 44, cvs.height - p.bottom);
    }
    ctx.fillStyle = '#00f2fe'; ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('Điểm: ' + score, 15, 32);
    if (over) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,cvs.width,cvs.height);
        ctx.fillStyle = '#ff0055'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('GAME OVER', 115, 240);
        ctx.fillStyle = '#00f2fe'; ctx.font = '16px sans-serif'; ctx.fillText('Click chuột để chơi lại', 125, 280);
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
